name: SonarQube

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Lifted to job level because the `secrets` context is not available in a
    # step-level `if:` — the condition has to read it through `env`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads git history to blame issues onto the commit that
          # introduced them and to resolve new-code periods. A shallow clone
          # makes every line look like it landed in the latest commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      # --ignore-scripts: no dependency lifecycle script (preinstall, install,
      # postinstall) runs on the CI runner, which holds SONAR_TOKEN in its env.
      # Nothing here needs them: electron is mocked in the tests (so its binary
      # download is not required) and esbuild resolves its native binary
      # through optionalDependencies.
      - run: npm ci --ignore-scripts

      # sonar.projectVersion is not stored in sonar-project.properties: it would
      # drift from package.json at every release and misattribute new code to a
      # stale version. Read it here instead, from the single source of truth.
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Type errors must fail the build here rather than surface as Sonar
      # smells — tsc is the authority on types, Sonar is not.
      # `npm run` rather than `npx`: npx falls back to downloading an unpinned
      # package from the registry when the binary is missing locally, whereas
      # npm run only resolves binaries already installed from package-lock.json.
      - run: npm run typecheck

      # Writes coverage/lcov.info, read by sonar.javascript.lcov.reportPaths.
      - run: npm run test:coverage

      # SONAR_TOKEN can only be issued from the Sonar account behind the
      # server, so it has to be set by the repository owner — a contributor
      # cannot provide it, and forks never inherit repo secrets. Until it
      # exists the scan is skipped rather than failed: a missing credential
      # is a setup state, not a defect in the code under review, and a
      # permanently red check trains reviewers to ignore the signal.
      # Everything above (npm ci, tsc, tests + coverage) still gates the PR.
      - name: Warn when SONAR_TOKEN is missing
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=SonarQube analysis skipped::SONAR_TOKEN is not set on this repository, so the scan did not run. It has to be added by the repository owner under Settings > Secrets and variables > Actions — the token itself is generated from the Sonar account (My Account > Security). Add SONAR_HOST_URL too when using a self-hosted server."

      # SONAR_HOST_URL must always be set: the job env exports it even when the
      # secret is missing, and the scanner rejects an empty value ("URI with
      # undefined scheme") instead of falling back to SonarCloud. Use
      # https://sonarcloud.io for SonarQube Cloud.
      # Third-party action pinned to a full commit SHA: a tag can be moved to
      # point at arbitrary code, a commit SHA cannot. Bump SHA + comment together.
      # continue-on-error: a Sonar-side failure (expired/revoked token, server
      # outage) is reported but does not block the PR — same reasoning as the
      # missing-token skip above.
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        with:
          # Project identity comes from repo variables so a fork can analyse
          # its own project without editing a tracked file. The `||` fallbacks
          # keep the workflow runnable when no variable is set.
          # sonar.organization is required by SonarQube Cloud and meaningless
          # on a self-hosted server, so it is only passed when
          # SONAR_ORGANIZATION is set.
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'dual' }}
            -Dsonar.projectName=${{ vars.SONAR_PROJECT_NAME || 'Dual' }}
            -Dsonar.projectVersion=${{ steps.meta.outputs.version }}
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
