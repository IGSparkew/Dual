# SonarQube configuration — Dual
#
# Local run:  npx vitest run --coverage && sonar-scanner
# CI:         .github/workflows/sonarqube.yml (runs both on push/PR)
#
# CI needs SONAR_TOKEN in the repository secrets, which only the repository
# owner can add — the token is issued from the Sonar account behind the
# server. Without it the workflow still runs tsc, the tests and coverage,
# and skips just the scan with a warning instead of failing.
#
# Deliberately holds no project identity and no version. Both are injected at
# scan time by the workflow:
#
#   sonar.projectKey      repo variable SONAR_PROJECT_KEY (default: dual)
#   sonar.projectName     repo variable SONAR_PROJECT_NAME (default: Dual)
#   sonar.projectVersion  read from package.json
#   sonar.organization    repo variable SONAR_ORGANIZATION (SonarQube Cloud
#                         only — omitted when unset, for a self-hosted server)
#
# Hardcoding the version here would silently drift from package.json at every
# release, and Sonar would then attribute new code to the wrong version —
# which breaks new-code periods and the quality gate that depends on them.
# Keeping identity out of the file also lets a fork analyse its own project
# without editing a tracked file.

# ─── Sources ────────────────────────────────────────────────────────────────
# Keep in sync with coverage.include in vitest.config.ts: anything analysed
# here must also be reported on there, otherwise untested files silently drop
# out of the coverage figure instead of landing at 0 %.
sonar.sources=src,modules,electron,scripts
sonar.sourceEncoding=UTF-8

# Test files live BOTH under tests/ and next to the code they cover, so
# sonar.tests must list the same roots as sonar.sources — pointing it at
# `tests` alone leaves the 15 colocated suites analysed as production code
# (verified against a local SonarQube: only 5 of 20 were picked up).
# sonar.test.inclusions then selects the test files inside those roots, and
# sonar.exclusions keeps them out of the source side.
sonar.tests=src,modules,electron,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Test files must be excluded from the source side: sonar.sources and
# sonar.tests overlap here, and a file indexed as both is a hard analysis
# error ("can't be indexed twice").
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/node_modules/**,\
  **/dist/**,\
  **/dist-electron/**,\
  **/coverage/**,\
  **/userdata/**,\
  **/public/samples/**,\
  **/*.d.ts

# ─── Coverage ───────────────────────────────────────────────────────────────
# lcov is the only format SonarQube reads for JS/TS. Written by
# `npx vitest run --coverage` (v8 provider, reporter: ['text', 'lcov']).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files that carry no testable logic. Excluding them from the coverage metric
# only — they are still analysed for bugs, smells and duplication above.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.d.ts,\
  **/index.ts,\
  **/main.tsx,\
  **/*.module.css,\
  scripts/**,\
  electron/preload.ts

# ─── Duplication ────────────────────────────────────────────────────────────
# Manifests and layout JSON are declarative and legitimately repetitive.
sonar.cpd.exclusions=**/manifest.json,layouts/**,config/**
